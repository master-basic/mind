<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cued Recall — Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; padding: 24px; }
h1 { font-size: 20px; margin-bottom: 20px; color: #58a6ff; }
h2 { font-size: 14px; margin: 16px 0 8px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-bottom: 16px; }
.models-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-bottom: 16px; }
.model-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; }
.model-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.model-card .name { font-size: 13px; font-weight: 600; color: #f0f6fc; text-transform: capitalize; }
.model-card .dot { width: 8px; height: 8px; border-radius: 50%; background: #f85149; }
.model-card .dot.up { background: #3fb950; }
.model-card .sub { font-size: 11px; color: #8b949e; margin-left: auto; }
.model-card .meta { font-size: 11px; color: #8b949e; margin-bottom: 6px; word-break: break-all; }
.bar { height: 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: #58a6ff; width: 0; transition: width .3s; }
.bar.warn > span { background: #d29922; }
.bar.hot > span { background: #f85149; }
.bar-label { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; margin-top: 4px; }
.stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; }
.stat-card .value { font-size: 28px; font-weight: 600; color: #f0f6fc; }
.stat-card .label { font-size: 11px; color: #8b949e; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 6px 8px; background: #161b22; border-bottom: 1px solid #30363d; color: #8b949e; }
td { padding: 6px 8px; border-bottom: 1px solid #21262d; font-family: monospace; }
tr:hover td { background: #161b22; }
.status-hot { color: #d29922; }
.status-shelved { color: #58a6ff; }
.status-truncated { color: #a371f7; }
.status-purged { color: #f85149; }
.verification-unknown { color: #8b949e; }
.verification-accepted { color: #3fb950; }
.verification-corrected { color: #f85149; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 500; }
.badge-hot { background: #d2992220; color: #d29922; border: 1px solid #d2992240; }
.badge-shelved { background: #58a6ff20; color: #58a6ff; border: 1px solid #58a6ff40; }
.badge-truncated { background: #a371f720; color: #a371f7; border: 1px solid #a371f740; }
.badge-purged { background: #f8514920; color: #f85149; border: 1px solid #f8514940; }
.badge-gpu { background: #3fb95020; color: #3fb950; border: 1px solid #3fb95040; }
.badge-cpu { background: #58a6ff20; color: #58a6ff; border: 1px solid #58a6ff40; }
.badge-off { background: #8b949e20; color: #8b949e; border: 1px solid #8b949e40; }
.proc-row { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; margin-top: 3px; }
.proc-row b { color: #c9d1d9; font-weight: 500; }
.note { font-size: 11px; color: #484f58; margin: -8px 0 12px; }
#last-updated { font-size: 11px; color: #484f58; margin-bottom: 16px; }
.server-info { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 16px; font-size: 12px; }
.server-info span { color: #8b949e; }
.filters { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.filters select, .filters input { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.filters button { background: #238636; color: #fff; border: none; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
.filters button:hover { background: #2ea043; }
.filters .btn-danger { background: #da3633; }
.filters .btn-danger:hover { background: #f85149; }
.chk-cell { width: 32px; text-align: center; }
.chk { width: 14px; height: 14px; cursor: pointer; accent-color: #58a6ff; }
#sel-count { font-size: 12px; color: #8b949e; margin-left: 8px; }
.gist-cell { color: #c9d1d9; max-width: 240px; }
.tag-badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; margin: 1px 2px 1px 0; background: #30363d; color: #c9d1d9; border: 1px solid #484f58; white-space: nowrap; }
</style>
</head>
<body>

<h1>⬡ Cued Recall Middleware</h1>
<div class="server-info" id="server-info">Connecting...</div>
<div id="last-updated"></div>

<h2>Models — context usage</h2>
<div id="wedge-banner"></div>
<div class="models-grid" id="models-grid"></div>

<h2>GPU / System</h2>
<div class="stats-grid" id="gpu-grid"></div>
<div class="models-grid" id="proc-grid"></div>
<div class="note" id="gpu-note"></div>

<h2>Stats</h2>
<div class="stats-grid" id="stats-grid"></div>

<h2>Tokens / sec</h2>
<div class="stats-grid" id="tps-grid"></div>

<h2>Memory health</h2>
<div class="stats-grid" id="health-grid"></div>
<div class="note" id="health-note"></div>

<h2>Recall budget — last turns</h2>
<div id="budget-panel"></div>

<h2>Token distribution</h2>
<div id="histogram-panel"></div>

<h2>Store growth</h2>
<div id="growth-panel"></div>

<h2>Most recalled blocks</h2>
<div id="effectiveness-panel"></div>

<h2>Blocks</h2>
<div class="filters">
  <select id="filter-status">
    <option value="">All status</option>
    <option value="hot">hot</option>
    <option value="shelved">shelved</option>
    <option value="truncated">truncated</option>
    <option value="purged">purged</option>
  </select>
  <select id="filter-type">
    <option value="">All types</option>
    <option value="reasoning">reasoning</option>
    <option value="result">result</option>
    <option value="reading">reading</option>
  </select>
  <input type="text" id="filter-conv" placeholder="conversation_id" size="24">
  <select id="filter-tag">
    <option value="">All tags</option>
  </select>
  <select id="filter-recall-preset" title="Recall count">
    <option value="">Any recalls</option>
    <option value="0-0">Never recalled</option>
    <option value="1-5">1–5 recalls</option>
    <option value="1-10">1–10 recalls</option>
    <option value="6-20">6–20 recalls</option>
    <option value="21-">21+ recalls</option>
  </select>
  <input type="number" id="filter-recall-min" placeholder="min" min="0" size="4" style="width:64px" title="Minimum recalls">
  <input type="number" id="filter-recall-max" placeholder="max" min="0" size="4" style="width:64px" title="Maximum recalls">
  <select id="sort-by" title="Sort by">
    <option value="created_at">newest</option>
    <option value="token_count">tokens</option>
    <option value="recall_count">recalls</option>
    <option value="last_recalled">last recalled</option>
  </select>
  <select id="sort-order" title="Sort direction">
    <option value="desc">desc</option>
    <option value="asc">asc</option>
  </select>
  <button onclick="showDeadWeight()" title="Never recalled, largest first">Dead weight</button>
  <button onclick="resetFilters()">Reset</button>
  <select id="page-size" title="Rows per page">
    <option value="50">50 / page</option>
    <option value="100" selected>100 / page</option>
    <option value="250">250 / page</option>
    <option value="500">500 / page</option>
  </select>
  <button onclick="loadBlocks()">Refresh</button>
  <button class="btn-danger" id="btn-delete" onclick="deleteSelected()" disabled>Delete Selected <span id="sel-count"></span></button>
  <button class="btn-danger" onclick="runJudge()">Run Judge Pass</button>
  <button class="btn-danger" onclick="clearKv()">Clear KV Cache</button>
  <button onclick="exportBlocks()">Export</button>
  <input type="file" id="import-file" accept="application/json" style="display:none">
  <button onclick="document.getElementById('import-file').click()">Import</button>
</div>

<div style="overflow-x: auto;">
<table>
<thead><tr>
  <th class="chk-cell"><input type="checkbox" id="sel-all" class="chk" title="Select all"></th>
  <th>block_id</th>
  <th>type</th>
  <th>status</th>
  <th>verification</th>
  <th>gist</th>
  <th>tags</th>
  <th>tokens</th>
  <th>recalls</th>
  <th>created</th>
  <th>conversation</th>
  <th>turn</th>
</tr></thead>
<tbody id="blocks-tbody"></tbody>
</table>
</div>

<div id="blocks-pager" style="display:flex;align-items:center;gap:12px;margin-top:10px;">
  <button id="page-first" onclick="gotoPage(0)">&laquo; First</button>
  <button id="page-prev" onclick="stepPage(-1)">&lsaquo; Prev</button>
  <span id="page-status" style="color:#8b949e;font-size:13px;"></span>
  <button id="page-next" onclick="stepPage(1)">Next &rsaquo;</button>
  <button id="page-last" onclick="gotoPage(-1)">Last &raquo;</button>
</div>

<script>
const API = '';
const selected = new Set();

function updateSelUI() {
  const n = selected.size;
  document.getElementById('sel-count').textContent = n ? `(${n})` : '';
  document.getElementById('btn-delete').disabled = n === 0;
}

async function loadServerInfo() {
  try {
    const r = await fetch(API + '/health');
    const data = await r.json();
    document.getElementById('server-info').innerHTML =
      `<span>status</span> ${data.status} &nbsp; <span>store</span> ${data.store}`;
  } catch (e) {
    document.getElementById('server-info').textContent = 'Error: ' + e.message;
  }
}

async function loadModels() {
  const grid = document.getElementById('models-grid');
  try {
    const r = await fetch(API + '/admin/models');
    const data = await r.json();
    grid.innerHTML = '';
    for (const m of data.models || []) {
      const pct = m.kv_used_ratio != null ? Math.round(m.kv_used_ratio * 1000) / 10 : null;
      const barCls = pct == null ? '' : (pct >= 90 ? 'hot' : (pct >= 70 ? 'warn' : ''));
      const ctx = m.n_ctx != null ? m.n_ctx.toLocaleString() : '—';
      const used = m.used_tokens != null ? m.used_tokens.toLocaleString() : '—';
      const src = m.source ? ` <span style="color:#484f58">(${m.source})</span>` : '';
      const usageLine = pct == null
        ? `<div class="bar-label"><span>context ${ctx} tokens</span><span>usage n/a</span></div>`
        : `<div class="bar ${barCls}"><span style="width:${Math.min(pct,100)}%"></span></div>
           <div class="bar-label"><span>${used} / ${ctx} tok</span><span>${pct}%${src}</span></div>`;
      grid.innerHTML += `
        <div class="model-card">
          <div class="head">
            <span class="dot ${m.up ? 'up' : ''}"></span>
            <span class="name">${m.name}</span>
            <span class="sub">${m.up ? 'up' : 'down'}</span>
          </div>
          <div class="meta">${m.model || m.endpoint || ''}</div>
          ${usageLine}
        </div>`;
    }
    if (!(data.models || []).length) {
      grid.innerHTML = '<div class="model-card" style="color:#8b949e">No model info</div>';
    }
  } catch (e) {
    grid.innerHTML = `<div class="model-card" style="color:#f85149">Error: ${e.message}</div>`;
  }
}

function fmtBytes(n) {
  if (n == null) return '—';
  if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
  if (n >= 1048576) return Math.round(n / 1048576) + ' MB';
  return Math.round(n / 1024) + ' KB';
}

function fmtUptime(s) {
  if (s == null) return '—';
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600);
  const m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function barFor(ratio) {
  const pct = Math.round(ratio * 1000) / 10;
  const cls = pct >= 90 ? 'hot' : (pct >= 70 ? 'warn' : '');
  return { pct, cls };
}

async function loadSystem() {
  const gpuGrid = document.getElementById('gpu-grid');
  const procGrid = document.getElementById('proc-grid');
  try {
    const r = await fetch(API + '/admin/system');
    const data = await r.json();
    gpuGrid.innerHTML = '';
    procGrid.innerHTML = '';

    if (data.error) {
      gpuGrid.innerHTML = `<div class="stat-card" style="color:#d29922">${data.error}</div>`;
    }

    // --- device-level GPU cards ---
    for (const g of data.gpus || []) {
      if (g.memory_used_ratio != null) {
        const { pct, cls } = barFor(g.memory_used_ratio);
        gpuGrid.innerHTML += `
          <div class="stat-card">
            <div class="value">${pct}%</div>
            <div class="label">VRAM — ${g.name}</div>
            <div class="bar ${cls}" style="margin-top:8px"><span style="width:${Math.min(pct,100)}%"></span></div>
            <div class="bar-label"><span>${g.memory_used_mb} MB</span><span>of ${g.memory_total_mb} MB</span></div>
          </div>`;
      }
      if (g.util_gpu_pct != null) {
        gpuGrid.innerHTML += `<div class="stat-card"><div class="value">${g.util_gpu_pct}%</div><div class="label">GPU utilization</div></div>`;
      }
      if (g.util_mem_pct != null) {
        gpuGrid.innerHTML += `<div class="stat-card"><div class="value">${g.util_mem_pct}%</div><div class="label">Memory bus utilization</div></div>`;
      }
      if (g.temperature_c != null) {
        gpuGrid.innerHTML += `<div class="stat-card"><div class="value">${g.temperature_c}°C</div><div class="label">GPU temperature</div></div>`;
      }
    }
    if (!(data.gpus || []).length && !data.error) {
      gpuGrid.innerHTML += '<div class="stat-card" style="color:#8b949e"><div class="label">No NVIDIA GPU detected (nvidia-smi unavailable)</div></div>';
    }

    // --- host RAM / CPU ---
    const h = data.host || {};
    if (h.ram_used_ratio != null) {
      const { pct, cls } = barFor(h.ram_used_ratio);
      gpuGrid.innerHTML += `
        <div class="stat-card">
          <div class="value">${pct}%</div>
          <div class="label">Host RAM</div>
          <div class="bar ${cls}" style="margin-top:8px"><span style="width:${Math.min(pct,100)}%"></span></div>
          <div class="bar-label"><span>${fmtBytes(h.ram_used_bytes)}</span><span>of ${fmtBytes(h.ram_total_bytes)}</span></div>
        </div>`;
    }
    if (h.cpu_percent != null) {
      gpuGrid.innerHTML += `<div class="stat-card"><div class="value">${h.cpu_percent}%</div><div class="label">Host CPU (${h.cpu_count || '?'} threads)</div></div>`;
    }

    // --- stack uptime (when run.py launched the servers, not OS uptime) ---
    if (data.uptime_s != null) {
      const started = data.launched_at ? new Date(data.launched_at * 1000) : null;
      gpuGrid.innerHTML += `
        <div class="stat-card">
          <div class="value">${fmtUptime(data.uptime_s)}</div>
          <div class="label" title="${started ? started.toISOString() : ''}">Uptime — since ${started ? started.toLocaleString() : '?'}</div>
        </div>`;
    }

    // --- per-model breakdown ---
    const procs = data.processes || {};
    let estTotal = 0;
    for (const [name, p] of Object.entries(procs)) {
      if (p.vram_est_bytes) estTotal += p.vram_est_bytes;
      const dev = p.device || (p.up ? 'off' : 'off');
      const devLabel = p.device ? p.device.toUpperCase() : (p.up ? 'n/a' : 'down');
      const vramLine = p.device === 'gpu'
        ? `<div class="proc-row"><span title="Per-process VRAM cannot be measured on this driver (nvidia-smi reports N/A for GeForce cards under Windows WDDM). This is the GGUF weight size, which excludes the KV cache.">VRAM (est.)</span><b>${fmtBytes(p.vram_est_bytes)}</b></div>`
        : '';
      const kvNote = p.no_kv_offload ? ' <span style="color:#484f58">KV in RAM</span>' : '';
      procGrid.innerHTML += `
        <div class="model-card">
          <div class="head">
            <span class="dot ${p.up ? 'up' : ''}"></span>
            <span class="name">${name}</span>
            <span class="sub"><span class="badge badge-${dev}">${devLabel}</span></span>
          </div>
          <div class="meta">${p.model_path ? p.model_path.replace(/\\/g,'/').split('/').pop() : (p.up ? 'port ' + p.port : 'not running')}${kvNote}</div>
          ${vramLine}
          <div class="proc-row"><span title="Resident set size. For GPU-resident models this includes memory-mapped GGUF pages, so it is not purely CPU RAM in use.">RSS</span><b>${fmtBytes(p.rss_bytes)}</b></div>
          <div class="proc-row"><span>CPU</span><b>${p.cpu_percent != null ? p.cpu_percent + '%' : '—'}</b></div>
          <div class="proc-row"><span>threads / ctx</span><b>${p.num_threads != null ? p.num_threads : '—'} / ${p.n_ctx != null ? p.n_ctx.toLocaleString() : '—'}</b></div>
          <div class="proc-row"><span>uptime</span><b>${fmtUptime(p.uptime_s)}</b></div>
        </div>`;
    }

    // Show the estimate against the real device figure rather than hiding the
    // gap -- the difference is KV cache plus everything else on the GPU.
    const gpu0 = (data.gpus || [])[0];
    if (gpu0 && gpu0.memory_used_mb != null && estTotal) {
      const gap = gpu0.memory_used_mb - Math.round(estTotal / 1048576);
      document.getElementById('gpu-note').textContent =
        `Model weights on GPU total ~${fmtBytes(estTotal)} (estimated from GGUF size); `
        + `device reports ${gpu0.memory_used_mb} MB in use — the ~${gap} MB difference is KV cache, CUDA context, and other applications.`;
    } else {
      document.getElementById('gpu-note').textContent = '';
    }
  } catch (e) {
    gpuGrid.innerHTML = `<div class="stat-card" style="color:#f85149">Error: ${e.message}</div>`;
    procGrid.innerHTML = '';
  }
}

async function loadStats() {
  try {
    const r = await fetch(API + '/admin/stats');
    const data = await r.json();
    const grid = document.getElementById('stats-grid');
    grid.innerHTML = '';

    const cards = [
      { label: 'Msgpack Files', value: data.msgpack_files },
      { label: 'WAL Events', value: data.wal_events },
    ];

    for (const [key, val] of Object.entries(data.blocks_by_status_type || {})) {
      cards.push({ label: key.replace(/_/g, ' '), value: val });
    }

    for (const c of cards) {
      grid.innerHTML += `<div class="stat-card"><div class="value">${c.value}</div><div class="label">${c.label}</div></div>`;
    }
  } catch (e) {
    document.getElementById('stats-grid').innerHTML = `<div class="stat-card" style="color:#f85149">Error: ${e.message}</div>`;
  }
}

async function loadTps() {
  try {
    const r = await fetch(API + '/admin/tps');
    const data = await r.json();
    const grid = document.getElementById('tps-grid');
    grid.innerHTML = '';

    const cards = [
      { label: 'Avg T/S', value: data.avg_tps || 0 },
      { label: 'Samples', value: data.count || 0 },
    ];

    const recent = data.recent || [];
    if (recent.length) {
      const last = recent[recent.length - 1];
      cards.push({ label: 'Last T/S', value: last.tps });
      cards.push({ label: 'Last Tokens', value: last.tokens });
      cards.push({ label: 'Last Elapsed', value: last.elapsed + 's' });
    }

    for (const c of cards) {
      grid.innerHTML += `<div class="stat-card"><div class="value">${c.value}</div><div class="label">${c.label}</div></div>`;
    }
  } catch (e) {
    document.getElementById('tps-grid').innerHTML = `<div class="stat-card" style="color:#f85149">Error: ${e.message}</div>`;
  }
}

// fetch() does not reject on 4xx/5xx, so a missing endpoint would parse as
// JSON and render as real-looking zeros. These panels are new, so a middleware
// still running an older build returns 404 here -- say so instead of showing
// "0 of 0 tokens" as though the store were empty.
async function getJSON(path) {
  const r = await fetch(API + path);
  if (!r.ok) {
    throw new Error(r.status === 404
      ? 'endpoint not available — restart the middleware to load this build'
      : `HTTP ${r.status}`);
  }
  return r.json();
}

const fmt = n => (n ?? 0).toLocaleString();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Shared bar row used by the histogram and growth panels. Widths are a
// percentage of the largest row so a single huge block does not flatten
// everything else into invisibility.
function barRow(label, value, max, sub, color) {
  const pct = max > 0 ? Math.max(1, Math.round(100 * value / max)) : 0;
  return `<div style="display:grid;grid-template-columns:110px 1fr 150px;gap:10px;align-items:center;margin-bottom:4px;">
    <span style="font-size:11px;color:#8b949e;text-align:right;">${esc(label)}</span>
    <div class="bar"><span style="width:${pct}%;${color ? 'background:' + color : ''}"></span></div>
    <span style="font-size:11px;color:#8b949e;">${esc(sub)}</span>
  </div>`;
}

// Wedge state. A lost llama.cpp slot leaves /health answering while the
// inference queue blocks forever, so the page can look fine while nothing
// works. Surface it, and offer the only thing that actually recovers it --
// clearing the KV cache cannot, since that call goes through /slots, which is
// precisely what is blocked.
let restartInFlight = false;

async function loadWedge() {
  const el = document.getElementById('wedge-banner');
  try {
    const d = await getJSON('/admin/wedge');
    if (!d.any_wedged) {
      const unreachable = Object.entries(d.servers || {})
        .filter(([, v]) => v.queue === 'unreachable').map(([k]) => k);
      el.innerHTML = unreachable.length
        ? `<div class="note" style="color:#d29922">Not reachable: ${esc(unreachable.join(', '))}</div>`
        : '';
      return;
    }
    const wedged = Object.entries(d.servers).filter(([, v]) => v.wedged).map(([k]) => k);
    el.innerHTML = `
      <div class="model-card" style="border-color:#f85149;margin-bottom:12px">
        <div class="head">
          <span class="dot"></span>
          <span class="name">${esc(wedged.join(', '))} wedged</span>
        </div>
        <div class="meta">Answering /health but the inference queue is blocked — requests will hang until the process is restarted. Clearing the KV cache will not help: that call goes through /slots, which is what is blocked.</div>
        ${wedged.map(n => `<button class="btn-danger" style="background:#da3633;color:#fff;border:none;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:12px;margin-right:6px" onclick="restartServer('${esc(n)}')">Restart ${esc(n)}</button>`).join('')}
        ${d.restart_supported ? '' : '<div class="note" style="margin-top:8px">Launcher not supervising — restart run.bat manually.</div>'}
      </div>`;
  } catch (e) {
    el.innerHTML = `<div class="note">Wedge check unavailable: ${esc(e.message)}</div>`;
  }
}

async function restartServer(name) {
  if (restartInFlight) return;
  if (!confirm(`Restart the ${name} server?\n\nThis aborts anything currently generating and the model reload takes up to a minute.`)) return;
  restartInFlight = true;
  try {
    const r = await fetch(API + '/admin/server/restart?name=' + encodeURIComponent(name), { method: 'POST' });
    const d = await r.json();
    alert(r.ok ? (d.note || 'Restart requested.')
               : `Could not request restart: ${d.detail || r.status}`);
  } catch (e) {
    alert('Could not request restart: ' + e.message);
  } finally {
    restartInFlight = false;
  }
}

async function loadHealth() {
  try {
    const d = await getJSON('/admin/stats/recall?top=10');
    const deadPct = d.tokens ? Math.round(100 * d.never_recalled_tokens / d.tokens) : 0;
    const cards = [
      { label: 'Blocks', value: fmt(d.blocks) },
      { label: 'Tokens stored', value: fmt(d.tokens) },
      { label: 'Total recalls', value: fmt(d.total_recalls) },
      { label: 'Never recalled', value: fmt(d.never_recalled_blocks) },
      { label: 'Dead tokens', value: deadPct + '%' },
    ];
    document.getElementById('health-grid').innerHTML = cards.map(c =>
      `<div class="stat-card"><div class="value">${c.value}</div><div class="label">${c.label}</div></div>`
    ).join('');
    document.getElementById('health-note').textContent =
      `${fmt(d.never_recalled_tokens)} of ${fmt(d.tokens)} tokens have never been recalled` +
      (deadPct >= 50 ? ' — most of the store is unused; see Dead weight below.' : '.');

    const rows = (d.by_verification || []).map(v =>
      `<tr><td class="verification-${esc(v.verification)}">${esc(v.verification)}</td>
       <td>${fmt(v.blocks)}</td><td>${fmt(v.recalls)}</td><td>${fmt(v.tokens)}</td></tr>`).join('');
    const top = (d.top_recalled || []).map(b =>
      `<tr><td title="${esc(b.block_id)}">${esc((b.block_id || '').slice(0, 8))}</td>
       <td>${esc(b.type)}</td>
       <td class="verification-${esc(b.verification)}">${esc(b.verification)}</td>
       <td class="gist-cell" title="${esc(b.gist)}">${esc(b.gist)}</td>
       <td>${fmt(b.recall_count)}</td><td>${fmt(b.token_count)}</td></tr>`).join('');
    document.getElementById('effectiveness-panel').innerHTML = `
      <div style="overflow-x:auto"><table>
        <thead><tr><th>verification</th><th>blocks</th><th>recalls</th><th>tokens</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4">no data</td></tr>'}</tbody>
      </table></div>
      <div class="note" style="margin:8px 0 4px">Blocks marked <span class="verification-corrected">corrected</span> are excluded from recall; a high recall count there is history, not current behaviour.</div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>block_id</th><th>type</th><th>verification</th><th>gist</th><th>recalls</th><th>tokens</th></tr></thead>
        <tbody>${top || '<tr><td colspan="6">nothing recalled yet</td></tr>'}</tbody>
      </table></div>`;
  } catch (e) {
    document.getElementById('health-note').textContent = 'Error: ' + e.message;
  }
}

async function loadHistogram() {
  try {
    const d = await getJSON('/admin/stats/distribution');
    const buckets = d.buckets || [];
    const max = Math.max(1, ...buckets.map(b => b.blocks));
    document.getElementById('histogram-panel').innerHTML =
      buckets.map(b => barRow(b.label + ' tok', b.blocks, max,
        `${fmt(b.blocks)} blocks · ${fmt(b.tokens)} tok`)).join('') +
      `<div class="note">Bucket sizes are token counts per block. Weight concentrated in the top bucket means block_tokens_reasoning is not splitting large content.</div>`;
  } catch (e) {
    document.getElementById('histogram-panel').innerHTML = `<div class="note">Error: ${esc(e.message)}</div>`;
  }
}

async function loadGrowth() {
  try {
    const d = await getJSON('/admin/stats/growth?days=30');
    // Server returns one row per (day, type); fold to a per-day total so the
    // chart reads as store growth rather than a scatter of types.
    const byDay = {};
    for (const row of d.rows || []) {
      byDay[row.day] = byDay[row.day] || { blocks: 0, tokens: 0, types: {} };
      byDay[row.day].blocks += row.blocks;
      byDay[row.day].tokens += row.tokens;
      byDay[row.day].types[row.type] = row.tokens;
    }
    const days = Object.keys(byDay).sort();
    const max = Math.max(1, ...days.map(k => byDay[k].tokens));
    document.getElementById('growth-panel').innerHTML = days.length
      ? days.map(k => barRow(k, byDay[k].tokens, max,
          `${fmt(byDay[k].blocks)} blocks · ${fmt(byDay[k].tokens)} tok`)).join('') +
        `<div class="note">Tokens added per day. If this keeps climbing while truncated/purged counts stay flat, the judge is falling behind ingestion.</div>`
      : '<div class="note">No blocks in the last 30 days.</div>';
  } catch (e) {
    document.getElementById('growth-panel').innerHTML = `<div class="note">Error: ${esc(e.message)}</div>`;
  }
}

async function loadBudget() {
  try {
    const d = await getJSON('/admin/stats/budget?limit=15');
    const turns = d.turns || [];
    if (!turns.length) {
      document.getElementById('budget-panel').innerHTML =
        '<div class="note">No recall-budget events recorded yet. These are written on each turn once the middleware has been restarted with this build.</div>';
      return;
    }
    const rows = turns.map(t => {
      const budget = t.budget_tokens || 0;
      const pct = budget ? Math.min(100, Math.round(100 * t.tokens_used / budget)) : 0;
      const cls = pct >= 90 ? 'bar hot' : pct >= 70 ? 'bar warn' : 'bar';
      const when = new Date((t.timestamp || 0) * 1000).toLocaleTimeString();
      return `<tr>
        <td>${esc(when)}</td>
        <td>${fmt(t.candidates)}</td>
        <td>${fmt(t.admitted)}</td>
        <td${t.skipped_oversized ? ' class="status-hot"' : ''}>${fmt(t.skipped_oversized)}</td>
        <td>${fmt(t.skipped_corrected)}</td>
        <td style="min-width:160px">
          <div class="${cls}"><span style="width:${pct}%"></span></div>
          <div class="bar-label"><span>${fmt(t.tokens_used)} / ${fmt(budget)}</span><span>${pct}%</span></div>
        </td>
        <td>${t.top_similarity != null ? t.top_similarity.toFixed(3) : '—'}</td>
      </tr>`;
    }).join('');
    document.getElementById('budget-panel').innerHTML = `
      <div style="overflow-x:auto"><table>
        <thead><tr><th>time</th><th>candidates</th><th>admitted</th><th>skipped (size)</th>
        <th>skipped (corrected)</th><th>budget used</th><th>top sim</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="note">Skipped (size) counts blocks that matched but did not fit the remaining budget. Persistently high means recall.budget_tokens is starving the injection, not that the index found nothing.</div>`;
  } catch (e) {
    document.getElementById('budget-panel').innerHTML = `<div class="note">Error: ${esc(e.message)}</div>`;
  }
}

// Paging state. The table used to request limit=100 with no offset, so only
// the newest 100 blocks were ever reachable -- the backend has supported
// limit/offset and returned `total` all along.
let blocksOffset = 0;
let blocksTotal = 0;
// Clicking Next faster than the fetch returns let an earlier response land
// after a later one and paint a stale page. Only the newest request may
// render.
let blocksRequestSeq = 0;

function blocksLimit() {
  return parseInt(document.getElementById('page-size').value, 10) || 100;
}

function stepPage(dir) {
  const next = blocksOffset + dir * blocksLimit();
  if (next < 0 || next >= blocksTotal) return;
  blocksOffset = next;
  loadBlocks();
}

function gotoPage(which) {
  // -1 means the last page: floor to a whole number of pages so the final
  // page fills from a page boundary rather than showing a ragged tail.
  const lim = blocksLimit();
  blocksOffset = which === -1 ? Math.max(0, Math.floor((blocksTotal - 1) / lim) * lim) : 0;
  loadBlocks();
}

function updatePager(shown) {
  const lim = blocksLimit();
  const first = blocksTotal === 0 ? 0 : blocksOffset + 1;
  const last = blocksOffset + shown;
  document.getElementById('page-status').textContent =
    blocksTotal === 0 ? 'no blocks'
      : `${first.toLocaleString()}–${last.toLocaleString()} of ${blocksTotal.toLocaleString()}`;
  const atStart = blocksOffset === 0;
  const atEnd = blocksOffset + lim >= blocksTotal;
  document.getElementById('page-first').disabled = atStart;
  document.getElementById('page-prev').disabled = atStart;
  document.getElementById('page-next').disabled = atEnd;
  document.getElementById('page-last').disabled = atEnd;
}

async function loadBlocks() {
  const status = document.getElementById('filter-status').value;
  const type = document.getElementById('filter-type').value;
  const conv = document.getElementById('filter-conv').value;
  const tag = document.getElementById('filter-tag').value;
  const params = new URLSearchParams({ limit: blocksLimit(), offset: blocksOffset });
  const rmin = document.getElementById('filter-recall-min').value;
  const rmax = document.getElementById('filter-recall-max').value;
  // Sent only when non-empty: "0" is a meaningful bound (never recalled), so
  // testing truthiness here would silently drop it.
  if (rmin !== '') params.set('recall_min', rmin);
  if (rmax !== '') params.set('recall_max', rmax);
  params.set('sort', document.getElementById('sort-by').value);
  params.set('order', document.getElementById('sort-order').value);
  if (status) params.set('status', status);
  if (type) params.set('type_', type);
  if (conv) params.set('conversation_id', conv);
  if (tag) params.set('tag', tag);

  const seq = ++blocksRequestSeq;
  try {
    const r = await fetch(API + '/admin/blocks?' + params);
    const data = await r.json();
    if (seq !== blocksRequestSeq) return;   // superseded by a later click
    blocksTotal = data.total || 0;
    // A filter change can leave the offset past the end of the new result
    // set, which would render an empty table on a non-empty filter. Walk back
    // to the last page that has rows and re-fetch.
    if (blocksOffset > 0 && !(data.items || []).length && blocksTotal > 0) {
      blocksOffset = Math.max(0, Math.floor((blocksTotal - 1) / blocksLimit()) * blocksLimit());
      return loadBlocks();
    }
    const tbody = document.getElementById('blocks-tbody');
    tbody.innerHTML = '';

    for (const b of data.items || []) {
      const created = new Date(b.created_at * 1000);
      const checked = selected.has(b.block_id) ? 'checked' : '';
      const tags = (b.tags || []).map(t => `<span class="tag-badge">${t}</span>`).join('');
      tbody.innerHTML += `<tr>
        <td class="chk-cell"><input type="checkbox" class="chk" data-id="${b.block_id}" ${checked}></td>
        <td title="${b.block_id}">${b.block_id}</td>
        <td>${b.type}</td>
        <td><span class="badge badge-${b.status}">${b.status}</span></td>
        <td class="verification-${b.verification}">${b.verification}</td>
        <td class="gist-cell" title="${b.gist || ''}">${b.gist || ''}</td>
        <td>${tags}</td>
        <td>${b.token_count}</td>
        <td>${b.recall_count}</td>
        <td title="${created.toISOString()}">${created.toLocaleString()}</td>
        <td title="${b.conversation_id || ''}">${b.conversation_id || ''}</td>
        <td>${b.turn_index}</td>
      </tr>`;
    }

    if (!data.items?.length) {
      tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:#484f58;padding:24px;">No blocks found</td></tr>';
    }
    updatePager((data.items || []).length);
  } catch (e) {
    if (seq !== blocksRequestSeq) return;
    document.getElementById('blocks-tbody').innerHTML = `<tr><td colspan="12" style="color:#f85149">Error: ${e.message}</td></tr>`;
  }
  loadTagFilter();
}

async function loadTagFilter() {
  try {
    const r = await fetch(API + '/admin/tags');
    const data = await r.json();
    const sel = document.getElementById('filter-tag');
    const current = sel.value;
    sel.innerHTML = '<option value="">All tags</option>';
    const groups = data.groups || { tags: data.taxonomy || [] };
    for (const [group, tags] of Object.entries(groups)) {
      let optionsHtml = '';
      for (const t of tags) {
        const n = (data.counts || {})[t] || 0;
        optionsHtml += `<option value="${t}">${t}${n ? ' (' + n + ')' : ''}</option>`;
      }
      sel.innerHTML += `<optgroup label="${group}">${optionsHtml}</optgroup>`;
    }
    sel.value = current;
  } catch (e) {
    // non-fatal: tag filter just stays empty
  }
}

async function exportBlocks() {
  const status = document.getElementById('filter-status').value;
  const type = document.getElementById('filter-type').value;
  const tag = document.getElementById('filter-tag').value;
  const params = new URLSearchParams({ limit: 1000 });
  if (status) params.set('status', status);
  if (type) params.set('type_', type);
  if (tag) params.set('tag', tag);
  try {
    const r = await fetch(API + '/admin/export?' + params);
    const data = await r.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cued_recall_export_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Export error: ' + e.message);
  }
}

document.getElementById('import-file').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const r = await fetch(API + '/admin/import', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data),
    });
    const result = await r.json();
    alert(`Imported ${result.imported || 0} block(s), skipped ${result.skipped || 0}`);
    loadBlocks();
  } catch (e) {
    alert('Import error: ' + e.message);
  } finally {
    e.target.value = '';
  }
});

async function clearKv() {
  if (!confirm('Clear the llama-server KV caches?\n\nThis drops cached prompt prefixes, so the next message re-processes its full history (slower for one turn). It does not free VRAM and does not delete any stored memory blocks.')) return;
  try {
    const r = await fetch(API + '/admin/kv/clear', { method: 'POST' });
    const data = await r.json();
    const lines = [];
    for (const [name, info] of Object.entries(data.servers || {})) {
      lines.push(info.error
        ? `${name}: ${info.error}`
        : `${name}: cleared ${info.cleared}/${info.slots} slot(s)`);
    }
    alert(`KV cache: ${data.cleared_slots || 0} slot(s) cleared\n\n${lines.join('\n')}`);
    refresh();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function runJudge() {
  if (!confirm('Force a judge pass? This may take a while.')) return;
  try {
    const r = await fetch(API + '/admin/judge/run', { method: 'POST' });
    const data = await r.json();
    const n = data.processed != null ? data.processed : '?';
    alert('Judge pass: ' + (data.status || 'done') + ' — ' + n + ' block(s) reviewed');
    refresh();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function refresh() {
  document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
  await Promise.all([loadServerInfo(), loadModels(), loadSystem(), loadStats(), loadTps(), loadBlocks(), loadWedge()]);
}

// Any change to what is being listed puts you back on page 1 -- staying on
// page 4 of a filter that now has two pages would show an empty table.
function reloadFromFirstPage() { blocksOffset = 0; loadBlocks(); }
document.getElementById('filter-status').addEventListener('change', reloadFromFirstPage);
document.getElementById('filter-type').addEventListener('change', reloadFromFirstPage);
document.getElementById('filter-tag').addEventListener('change', reloadFromFirstPage);
document.getElementById('page-size').addEventListener('change', reloadFromFirstPage);
document.getElementById('filter-conv').addEventListener('change', reloadFromFirstPage);
document.getElementById('sort-by').addEventListener('change', reloadFromFirstPage);
document.getElementById('sort-order').addEventListener('change', reloadFromFirstPage);
document.getElementById('filter-recall-min').addEventListener('change', reloadFromFirstPage);
document.getElementById('filter-recall-max').addEventListener('change', reloadFromFirstPage);

// The preset writes the min/max boxes rather than being a filter of its own,
// so there is one source of truth and an arbitrary range stays expressible.
// "21-" means 21 and up: an empty half is an open bound, not zero.
document.getElementById('filter-recall-preset').addEventListener('change', function() {
  const [lo, hi] = (this.value || '-').split('-');
  document.getElementById('filter-recall-min').value = lo ?? '';
  document.getElementById('filter-recall-max').value = hi ?? '';
  reloadFromFirstPage();
});

function resetFilters() {
  ['filter-status','filter-type','filter-tag','filter-conv',
   'filter-recall-min','filter-recall-max','filter-recall-preset'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('sort-by').value = 'created_at';
  document.getElementById('sort-order').value = 'desc';
  reloadFromFirstPage();
}

function showDeadWeight() {
  resetFiltersQuiet();
  document.getElementById('filter-recall-preset').value = '0-0';
  document.getElementById('filter-recall-min').value = '0';
  document.getElementById('filter-recall-max').value = '0';
  document.getElementById('sort-by').value = 'token_count';
  document.getElementById('sort-order').value = 'desc';
  reloadFromFirstPage();
}

function resetFiltersQuiet() {
  ['filter-status','filter-type','filter-tag','filter-conv',
   'filter-recall-min','filter-recall-max','filter-recall-preset'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

document.getElementById('sel-all').addEventListener('change', function() {
  const boxes = document.querySelectorAll('#blocks-tbody .chk');
  boxes.forEach(cb => {
    cb.checked = this.checked;
    const id = cb.dataset.id;
    if (this.checked) selected.add(id); else selected.delete(id);
  });
  updateSelUI();
});

document.getElementById('blocks-tbody').addEventListener('change', function(e) {
  if (e.target.classList.contains('chk')) {
    const id = e.target.dataset.id;
    if (e.target.checked) selected.add(id); else selected.delete(id);
    updateSelUI();
  }
});

async function deleteSelected() {
  const ids = [...selected];
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} block(s)? This cannot be undone.`)) return;
  try {
    const r = await fetch(API + '/admin/blocks/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({block_ids: ids}),
    });
    const data = await r.json();
    selected.clear();
    updateSelUI();
    document.getElementById('sel-all').checked = false;
    alert(`Deleted ${data.deleted || 0} block(s)`);
    loadBlocks();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// The analytics panels run full-table aggregates over index.db, so they are
// deliberately not on the 5 s loop with the live gauges -- that would put four
// table scans per 5 s against the same SQLite file the pipeline is writing to.
async function refreshAnalytics() {
  await Promise.all([loadHealth(), loadBudget(), loadHistogram(), loadGrowth()]);
}

refresh();
refreshAnalytics();
setInterval(refresh, 5000);
setInterval(refreshAnalytics, 30000);
</script>
