[project]
name = "cued-recall"
version = "0.1.0"
description = "Cued Recall Memory Middleware — semantic block memory for reasoning LLMs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "msgpack>=1.1.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Unit tests only. The integration evals in evaluate/ need running model
# servers and are not part of this suite.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
cued-recall = "cued_recall.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests cover the pure logic -- text splitting, token counting, the decay
# table, the index -- so they run in under a second with no servers up. If a
# test here needs a model endpoint, it belongs in evaluate/ instead.
addopts = "-q"
# Explicit: async tests carry @pytest.mark.asyncio. Auto mode would collect
# any coroutine it found, including ones meant to be awaited by a fixture.
asyncio_mode = "strict"
