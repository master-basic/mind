listen: 127.0.0.1:8000
reasoning_endpoint: http://127.0.0.1:8080
judge_endpoint: http://127.0.0.1:8081
embed_endpoint: http://127.0.0.1:8082
think_tags:
- <think>
- </think>
# store_path / snapshot_path / models_dir below are placeholders. If you run
# via run.py (recommended), it auto-fills these with a real location the
# first time (ramdisk, NVMe, or any directory via --storage/--snapshot) and
# keeps reusing that location on every later run. Only relevant if you run
# the middleware directly without run.py.
store_path: ./data/store
snapshot_path: ./snapshots
models_dir: ./data/models
snapshot_interval_min: 15
block_tokens_reasoning: 8000
# Which text of a block goes into the vector index.
#
#   composite  the question-plus-answer that produced the block (for reasoning
#              blocks) -- the shipped behaviour, and the one the measured
#              operating point below was tuned against
#   content    what the block itself says
#
# The trade is measurable and has not been measured. "composite" makes a
# reasoning block's vector contain the answer, which is why a later question
# sharing those entities scores 0.841 against phase-1 material (the trap family
# in evaluate/). "content" removes that -- but the query is always a question,
# and indexing an answer by its question is plausibly why paraphrase and
# Azerbaijani recall land 6 of 6.
#
# Both texts are stored on every block, so switching is a re-embed and not a
# re-ingest. Run evaluate/eval_retrieval.py's sweep first, then:
#   python backfill_missing_vectors.py --fill-embed-text --all
embed_source: composite
# Cap on either embed text, in whitespace words -- a first pass only. The
# binding limit is embed_ctx_tokens below, enforced in tokens, because words
# and tokens diverge worst on exactly the content worth keeping: 1,024 words of
# a code-heavy think trace measures 2,338 tokens on this stack.
embed_token_limit: 1024
# The embedding server's context window. Detected from its /props at startup;
# this is only the fallback for a server that will not report one. An input
# over the window comes back HTTP 400 and the block is stored but never
# becomes recallable.
embed_ctx_tokens: 2048
# Prompt budget in real tokens. run.py derives this from the reasoning
# server's --ctx-size (minus room for the reply and for tool definitions)
# and rewrites it on every launch, so it can't drift out of sync with the
# context window actually being served.
max_context_tokens: 26624
# Words -> estimated tokens. ~1.3 suits prose; raise it for code-heavy or
# CJK workloads, where a word costs more tokens.
tokens_per_word: 1.3
# Characters -> estimated tokens. The budget estimator takes whichever of
# these two signals gives the LARGER number, because under-counting overflows
# the server's window (a hard 400 and an empty reply) while over-counting only
# trims history early. Character count is the more stable of the two: measured
# against this stack it varies 2.8 (Azerbaijani) to 4.4 (Python source), where
# words-per-token varies 1.4 to 4.2.
chars_per_token: 3.2
# Held back from the context window for the reply. Must cover a reasoning
# model's think trace, which is generated before any visible output.
context_reserve_tokens: 4096
# Cap on tokens emitted per tool round. A stuck reasoning model otherwise
# streams megabytes of think trace with no finish_reason or tool call, and the
# client times out into an empty turn. null disables the cap.
max_completion_tokens: 8192
# Tool-call rounds per turn. When a model keeps requesting tools past this,
# the pipeline forces one final plain-text round so the turn cannot end empty.
max_tool_rounds: 5
# Forced answer rounds run with the think phase disabled (llama.cpp
# chat_template_kwargs.enable_thinking) so the model writes a reply
# immediately instead of re-spending the budget on reasoning. Set false if
# the server/model template does not support chat_template_kwargs.
forced_answer_no_think: true
# Above this fraction of the budget, stop estimating and have the server
# tokenize the prompt exactly (one ~450 ms call, only near the limit).
exact_count_threshold: 0.6
# A one-off message with no follow-up in its conversation would otherwise
# stay unrecallable forever (normal shelving only fires on the NEXT turn).
# This is how long to wait before shelving it anyway.
hot_shelve_timeout_s: 15
recall:
  k: 4
  # Lower than it looks: the relevance judge below, not this number, is what
  # keeps irrelevant blocks out. Measured with the judge on, 0.48 gives a
  # false-fire rate of 0.00 and recalls Azerbaijani paraphrases 6 of 6, where
  # the embedding alone needed 0.70 to be quiet and managed 3 of 6 there.
  # Raise it toward 0.62 if you turn judge_enabled off.
  threshold: 0.48
  budget_tokens: 3000
  # Ask the small model whether each candidate actually helps with the question
  # before injecting it. Similarity cannot tell "phase 1" from "phase 2" or
  # shared vocabulary from relevance -- both score above any usable threshold.
  # Costs one short call per candidate, in parallel, on the request path.
  judge_enabled: true
  judge_timeout_s: 5.0
  # How many candidates the judge scores, as a multiple of k. The judge now
  # scores the whole candidate set and the token budget is spent down that
  # ranked list, so relevance decides what fits rather than nearness.
  #
  # 1 is the vector search's own top-k -- a reorder of the set the judge
  # already saw, so TTFT is unchanged. Raising it costs one judge call per
  # extra candidate on a single-slot CPU server (~55 ms each measured here),
  # so 4 turns roughly 0.2 s into 0.9 s. Measure before raising it.
  candidate_multiplier: 1
  # Relevance score below which a candidate is dropped. The score is P(yes)
  # over the judge's first token, read from logprobs the server already
  # computes (+2.4 ms a call measured). 0.5 is exactly the decision the old
  # yes/no parse made -- verified identical on all 24 corpus pairs -- and the
  # band around it is empty: legitimate recalls score 0.899-0.998, traps
  # 0.012-0.119. A server without logprobs falls back to the yes/no text and
  # behaves as before.
  judge_score_floor: 0.5
  # What the judge reads as the archived note: the question the block was
  # written to answer ("question"), or the block's own words ("text", which is
  # what shipped until 2026-08-05).
  #
  # Measured against the real store representation at threshold 0.48 with the
  # judge on: false-fire 0.64 with "text", 0.09 with "question", and all 18
  # legitimate recalls survive either way. The 0.00 false-fire in benchmark.md
  # came from a harness that showed the judge a seed prompt rather than a
  # block; shown a real block it keeps 5 of 6 traps, which is the anchoring
  # failure grading_traps.md recorded.
  #
  # The untested trade: a block whose originating question differed but whose
  # content happens to answer the new one is now refused. If recall starts
  # missing things it used to find, set this to "text" first.
  judge_note: question
  # A pin is a user's explicit "keep this", but it bought nothing at recall:
  # the budget was spent down the relevance ranking, so an equally-scored
  # unpinned block that sorted first could take the last slot. This makes the
  # pin the tie-break in the ranked fill -- relevance still decides what fits,
  # a pin only decides between equals. Off restores the old order exactly.
  pin_priority: true
  # Cosine similarity floor for the judge stage. When the best vector
  # candidate is below this, the judge is not consulted and nothing is
  # recalled -- an off-topic turn used to pay 1.5-2.2 s of CPU calls to
  # conclude "nothing here" (evaluate/throughput.md).
  #
  # 0.0 = off, and that is the shipped default. The plan proposed 0.30, but
  # that sits below recall.threshold (0.48), so as prescribed it could never
  # fire, and the measured corpus has no safe value yet: off-topic control
  # probes top at ~0.50 while the weakest legitimate family (crosslingual)
  # tops at ~0.64, with trap/distractor above that -- so a floor wide enough
  # to remove the tax lands right against a real recall. 0.60 clears the
  # measured live off-topic band (0.49-0.57) but needs the widened corpus to
  # confirm it cannot cut one. Raise it only with a sweep.
  floor: 0.0
  # The keyword channel: a query's distinctive words matched against a block's
  # gist and tags, both already in the index (index.keyword_query). Used when
  # the embed server errors, so an outage degrades recall to keyword overlap
  # rather than silently recalling nothing; the relevance judge still
  # arbitrates the keyword candidates.
  tag_channel: true
  # The same channel as a SECOND candidate source on the normal path: vector
  # hits miss probes whose wording shares no tokens with a stored block but
  # whose gist/tags overlap, and this fixes that class. Keyword hits join the
  # judge pool and the judge arbitrates both channels (keyword candidates are
  # shown their gist/tags). Off by default: the vector operating point is a
  # measured result, and this needs the corpus rows where overlap fires recall
  # and overlap-with-different-content is still rejected before it is safe to
  # enable.
  tag_second_source: false
judge:
  # New material since the last pass before another one is worth running.
  interval_tokens: 20000
  min_age_s: 3600
  # Never recalled and older than this, and the block goes. Was 14 days, which
  # is not a human scale for conversation memory. Safe to shorten only because
  # purge_deletes_file is false, so purging can be undone.
  purge_age_s: 259200
  summary_max_tokens: 400
  # Under this, there is nothing to compress -- a summary of a paragraph is
  # longer than the paragraph. Raise it to make the judge do less.
  consolidate_min_tokens: 600
  # Only the model's own think traces get rewritten. Result blocks are the
  # answer the user actually saw and are already dense; reading blocks are
  # pasted or fetched source material. Handed either, a small model returns a
  # topic sentence rather than a summary, so they are left to decay instead.
  consolidate_types:
  - reasoning
  # Shorter deadline for blocks the model reported as holding nothing reusable.
  worthless_age_s: 172800
  # A pattern-matched correction stops the block being recalled at once, but
  # cannot purge it until this long has passed, and never if it was ever
  # recalled. The patterns have no measured false-positive rate; this is what
  # stops one bad match from being destructive.
  corrected_grace_s: 86400
  # Rewrites allowed per block, ever. Each one paraphrases the last.
  max_truncate_count: 2
  # Wall-clock ceiling for one pass. A pass that runs out of time stops without
  # marking the remainder judged, so the next pass resumes where it left off.
  max_pass_seconds: 600
  # Leave a block alone this long after judging it, so a pass sweeps forward
  # instead of revisiting the same blocks.
  rejudge_interval_s: 604800
  # Recalled this many times or more: keep verbatim, never compress.
  keep_recall_count: 3
  # Purging marks the block purged and drops its search vector, which is enough
  # to make it unrecallable and can be undone. Set true to delete the file too.
  purge_deletes_file: false
  max_per_pass: 200
  # Quiet time before a consolidation pass starts. The judge runs on CPU; this
  # keeps it out of the way of the reasoning model.
  idle_trigger_s: 300
  # Sweep at least this often even with no new material, so decay still happens
  # during a quiet week.
  sweep_interval_s: 21600
  # How long an unconsumed recall record is kept. Only the turn immediately
  # after a recall reads one back, so anything older belongs to a conversation
  # abandoned mid-turn. Swept once per judge pass.
  recall_record_ttl_s: 604800
  # Decay by earned utility rather than by "was it ever recalled".
  #
  # The rule this replaced made one recall, ever, a permanent exemption from
  # age-based purging: the system could say "used" and "never used" and nothing
  # in between, so a block recalled once eighteen months ago outranked one
  # recalled weekly, and the store could only grow. Set False to restore it --
  # this decides what gets deleted, and deletion is the one thing the index
  # cannot undo on its own.
  utility_decay: true
  # Days of idleness a single recall earns. A block recalled once survives a
  # month of being ignored, then goes.
  utility_recall_weight: 30.0
  # Extra days for a recall the user did not contradict. Worth more than a bare
  # recall: being shown to the model and not objected to is better evidence
  # than merely being shown.
  utility_uncontested_weight: 60.0
  # Utility at or below this purges, once past the age gate above. Zero means
  # "has spent more idle days than it earned".
  utility_floor: 0.0
  # Derive one block from several near-identical ones -- the abstraction the
  # store has never done. It records every episode and never reduces many into
  # one, so a question asked three times leaves three near-identical blocks,
  # each spending judge budget and prompt tokens to say the same thing.
  #
  # ON by default since the 2026-08-05 measurement (evaluate/eval_merge.py): a
  # real pass merged a genuine near-duplicate family into a correct
  # generalisation that kept every specific and fired recall, and refused the
  # family whose draft dropped one -- originals untouched either way. The only
  # pass that creates a memory rather than editing one, so read the
  # blocks_merged / merge_rejected WAL events after a pass. The originals are
  # retired reversibly -- status flipped and vector dropped, file always kept
  # even when purge_deletes_file is on, restorable via /admin/blocks/restore.
  merge_enabled: true
  # Similarity at which two blocks count as the same ground. Well above
  # recall.threshold: that asks "is this relevant", this asks "is this the same
  # thing said twice".
  merge_cluster_sim: 0.90
  # How many near-identical blocks before generalising is worth a model call.
  merge_min_cluster: 3
  # Blocks younger than this are left alone -- a cluster that formed in the
  # last hour is a conversation in progress, not a settled repetition.
  merge_min_age_s: 604800
  # Merges per pass. Low, because each one retires several blocks.
  merge_max_per_pass: 5
tagger:
  enabled: true
  endpoint: ""
  max_tags: 3
  gist_max_chars: 40
# Phrases that mark the previous answer as wrong. Anchored on purpose: a
# "corrected" block is dropped from recall AND skips the age gate before
# purging, so a false match destroys a good memory. Bare "wrong", "mistake",
# "fix" and "actually" are left out for that reason -- the verifier below is
# meant to catch what these miss.
correction_patterns:
- '\b(that|this|it|you)( is|''s| was| are|''re| were) (wrong|incorrect|mistaken|false)\b'
- '\b(isn''?t|wasn''?t|aren''?t) (right|correct|true)\b'
- '\bnot (right|correct|true)\b(?!\s+now)'
- '\bnot what i (asked|meant|wanted|said)\b'
- '\b(doesn''?t|does not|didn''?t|did not|won''?t|will not) work\b'
- '\bstill (doesn''?t|does not|not) work'
- '^\s*(that|this|it|there) (doesn''?t|does not|didn''?t|did not) exist\b'
- '\byou made (a|an) (mistake|error)\b'
- '\bwrong (answer|again)\b'
- '^\s*(no|nope|nah)[,.!]'
- 'səhv'
- 'yanlış'
- 'işləmir'
- 'alınmır'
- 'düz deyil'
- 'doğru deyil'
- '^\s*(yox|xeyr)[,.!]'
verifier:
  # Asks the small model whether a user message was correcting the previous
  # answer, for the phrasings correction_patterns misses. Runs after the reply,
  # never on the request path.
  enabled: true
  endpoint: ""
  max_chars: 1200
  # Span-level corrections (Phase 4.2). On, a "yes" also quotes the offending
  # part of the answer, and recall admits the corrected block with that span
  # redacted ("[a part of this block was reported wrong and removed]") instead
  # of suppressing the whole block -- the other claims in it stay usable.
  # Off by default: the yes/no prompt is the version eval_correction.py
  # measured, and the span quote needs its own eval rows first (the plan's
  # multi-claim correction rows under Evals and docs).
  spans: false
web_search:
  enabled: true
  # Keyless by default: bing (primary), with mojeek, duckduckgo and (if the
  # optional `ddgs` library is installed) a metasearch fallback as always-
  # available backups. Set a brave_api_key below and switch backend to
  # "brave" if you want a keyed provider ahead of the free scrapes.
  backend: bing
  # Get a key at https://brave.com/search/api/ (free tier available).
  brave_api_key: ''
  serper_api_key: ''
  searxng_url: ''
  # If the chosen backend fails or is throttled, try the others that are
  # configured rather than reporting "no results".
  fallback: true
  max_results: 5
  # Date/time queries are answered against a live, keyless clock (Akamai's
  # NTP-synced edge servers, time.akamai.com) instead of scraped snippets --
  # search engines serve cached snapshots that are routinely weeks or months
  # out of date, so a "what is today's date" query used to come back with the
  # wrong month. The timezone resolves from the server's IP (ipapi.co), or the
  # machine's own zone; set time_timezone to pin one (e.g. "Asia/Baku",
  # requires the `tzdata` package on Windows).
  time_intent: true
  time_timezone: ''
