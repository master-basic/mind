listen: 127.0.0.1:8000
reasoning_endpoint: http://127.0.0.1:8080
judge_endpoint: http://127.0.0.1:8081
embed_endpoint: http://127.0.0.1:8082
think_tags:
- <think>
- </think>
# store_path / snapshot_path / models_dir below are placeholders. If you run
# via run.py (recommended), it auto-fills these with a real location the
# first time (ramdisk, NVMe, or any directory via --storage/--snapshot) and
# keeps reusing that location on every later run. Only relevant if you run
# the middleware directly without run.py.
store_path: ./data/store
snapshot_path: ./snapshots
models_dir: ./data/models
snapshot_interval_min: 15
block_tokens_reasoning: 8000
# Prompt budget in real tokens. run.py derives this from the reasoning
# server's --ctx-size (minus room for the reply and for tool definitions)
# and rewrites it on every launch, so it can't drift out of sync with the
# context window actually being served.
max_context_tokens: 26624
# Words -> estimated tokens. ~1.3 suits prose; raise it for code-heavy or
# CJK workloads, where a word costs more tokens.
tokens_per_word: 1.3
# A one-off message with no follow-up in its conversation would otherwise
# stay unrecallable forever (normal shelving only fires on the NEXT turn).
# This is how long to wait before shelving it anyway.
hot_shelve_timeout_s: 15
recall:
  k: 4
  threshold: 0.62
  budget_tokens: 3000
judge:
  interval_tokens: 20000
  min_age_s: 3600
  purge_age_s: 1209600
  summary_max_tokens: 400
tagger:
  enabled: true
  endpoint: ""
  max_tags: 3
  gist_max_chars: 40
correction_patterns:
- that's wrong
- doesn't work
- ^no[,.]
- səhvdir
- işləmir
